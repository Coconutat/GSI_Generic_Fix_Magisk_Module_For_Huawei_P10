# P10 GSI 修复模组 —— 设备身份配置
# 本文件只被 post-fs-data.sh 读取, 修改后重启生效。

# ---------------------------------------------------------------- 机型标识
# MODEL=auto 表示自动读取 bootloader 传入的真实机型:
#   getprop ro.boot.product.hardware.sku   (=VTR-AL00)
# 真机可选值 (P10/P10 Plus 各版本):
#   VTR-AL00  VTR-TL00  VTR-L09  VTR-L29      (P10)
#   VKY-AL00  VKY-TL00  VKY-L09  VKY-L29      (P10 Plus)
MODEL=auto

# 品牌与厂商 (EMUI 原厂值)
BRAND=HUAWEI
MANUFACTURER=HUAWEI

# 内部设备代号。EMUI 原厂: ro.product.device=HWVTR
# 若不希望改动 GS I 的 device 名 (部分工具靠它识别 GSI), 设为 skip
DEVICE=HWVTR

# 产品名。auto = 与 MODEL 相同 (原厂 local.prop 里 name 就等于 model)
NAME=auto

# 硬件版本号 (原厂 product/hw_oem/*/prop/local.prop)
HARDWARE_VERSION=HL1AVTRM

# ---------------------------------------------------------------- 覆盖范围
# 1 = 同时覆盖分区级身份 ro.product.vendor.* 与 ro.product.odm.*
# 0 = 只覆盖全局 ro.product.* (最小改动)
OVERRIDE_PARTITION_PROPS=1

# ---------------------------------------------------------------- 高风险开关 (默认关)
# 1 = 把 ro.build.fingerprint / ro.build.description 也改成华为原厂值
#     影响: Play 认证、GSI OTA 识别、部分应用的风控 (会被识别为 EMUI 9)
#     真机原厂值: VTR-AL00-user 102.0.0 HUAWEIVTR-AL00 150-CHN-LGRP1 release-keys
SPOOF_FINGERPRINT=0

# 1 = 用 SUSFS 隐藏本模块目录与挂载 (需要 /data/adb/ksu/bin/ksu_susfs 存在)
SUSFS_HIDE=1
